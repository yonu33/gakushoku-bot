name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # テストは外部依存なし（node:test のみ）なので npm ci は不要。取得元へのアクセスも発生しない
      - run: npm test
